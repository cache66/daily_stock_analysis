instructions: |
  **商品涨价传导策略（Commodity Price Pass-Through Strategy）**

  核心目标：不是因为“某个商品涨价”就直接看多，而是识别哪些 A 股公司能把价格上涨真正转化为收入、毛利和净利润改善。

  ## 一、先确认“涨价事件”是否真实且足够新

  先使用 `analyze_commodity_pass_through` 获取结构化的商品映射、细分专题（subtheme）、产业链角色、传导方向、业绩释放概率，以及内置 A 股白名单/反例提示。
  然后再用 `search_comprehensive_intel`、`search_stock_news` 补充事件强度和日期证据。

  重点确认：
  1. 涨价品类是什么：光纤、光模块、DRAM、NAND、SSD、HDD、铜、铝、化工品等
  2. 涨价方向是什么：现货涨价、合约价上调、报价单上调、行业协会口径、龙头厂商提价
  3. 时间是否足够新：结论里必须写出明确日期（YYYY-MM-DD），避免把旧闻当新催化
  4. 催化是否持续：一次性脉冲、短期补库，还是供需缺口、去库、扩产滞后带来的阶段性景气

  如果只有模糊传闻、论坛转载或没有具体日期的旧消息，默认降低结论置信度。

  ## 二、把“涨价”映射到 A 股产业链位置

  先判断公司到底属于哪一层，不要因为板块联动就默认受益：

  - 上游资源/原材料：通常最直接受益，但也要警惕价格回落快、利润波动大
  - 中游制造/加工：只有在具备议价能力、订单锁价或库存优势时，才可能真正释放利润
  - 下游组装/品牌：若原料上涨无法传导，可能反而受损
  - 分销/渠道/模组：若库存低位拿货、涨价周期中有重估收益，可能阶段性受益

  对下列常见题材，优先按下面的链路理解：

  - 光纤涨价：优先看光纤预制棒、光纤光缆、光通信核心材料；若只是一般通信工程或设备集成，映射要保守
  - 内存涨价：优先看 DRAM/NAND 直接敞口、存储模组、主控或模组品牌、库存重估受益方；纯下游整机装配默认不算强受益
  - 硬盘涨价：优先看企业级存储、关键部件、控制器、存储配套链；若 A 股缺少纯正标的，要明确写“映射偏弱”

  如果找不到稳定证据证明公司和涨价品类存在直接收入关系，就不要硬贴“受益股”标签。

  `analyze_commodity_pass_through` 的结果优先级高于板块联想：

  - 若工具把公司判成 `upstream` 或 `midstream`，可继续验证是否具备直接受益逻辑
  - 若工具把公司判成 `distribution`，默认按间接受益处理
  - 若工具把公司判成 `downstream` 或 `weak_proxy`，默认先按伪受益或成本承压处理，除非有更强反证
  - 若工具命中 `matched_example.counterexample`，默认先按反例处理，不要轻易改写成直接受益

  ## 三、判断“利润传导”是否成立

  使用 `get_stock_info` 获取 `fundamental_context`、估值、成长、业绩和板块信息，再结合新闻证据判断：

  1. 公司收入里，涨价相关业务是否是主线，而不是边角业务
  2. 公司是否具备提价能力、紧供给优势、技术壁垒或龙头地位
  3. 本轮涨价更像“量价齐升”，还是只有原料涨、利润未必涨
  4. 公司是否可能受益于低价库存、订单锁价、海外映射或行业去库结束
  5. 如果新闻更多强调“成本压力”“采购涨价”“价格传导不顺”，则应偏负面解读

  对“涨价受益”结论必须区分三种情况：

  - 直接受益：收入和利润都更可能改善
  - 间接受益：有主题催化，但业绩兑现还需要观察
  - 伪受益/受损：板块跟涨但利润传导不顺，甚至成本受压

  ## 四、用财报和经营数据验证“业绩释放”概率

  `get_stock_info` 里如果能看到 `growth`、`earnings`、`valuation` 信息，重点检查：

  - 营收同比是否已经改善
  - 净利润同比是否已经改善
  - 最近财报、业绩预告、快报是否给出正向验证
  - 市值是否过大到难以被单一品类涨价明显驱动
  - 若已有业绩改善，但新闻只把它解释成题材炒作，要写出“基本面强于题材面”的判断

  如果财报尚未验证，但产业逻辑较强，应明确写成“预期释放”，不能表述成“已经兑现”。

  ## 五、最后才看技术确认，不要反过来

  使用 `get_daily_history`、`get_realtime_quote`、`analyze_trend` 判断：

  - 是否处于多头趋势或刚完成突破
  - 当前是否已经严重脱离 MA5/MA10，避免把基本面正确做成追高错误
  - 是否有放量突破、缩量回踩、趋势延续等配合

  技术面只负责判断“入场时机”和“资金是否认同”，不负责证明“业绩释放”本身。

  ## 六、业绩票固定排序优先级

  对商品涨价专题里的业绩票，默认按下面的固定优先级排序：

  `辨识度 > 持续增长 > 大成交 > 低估值 > 股息率 > 其它`

  默认不引入可调权重，先使用固定优先级的分层排序。

  ### 1. 辨识度是第一因子

  辨识度越强的票，走势通常越强。行业龙头、核心股往往成交更大、承接更强、走弱后也更容易反包。
  流动性与承接，是最重要的安全边际。

  小成交、边缘票、杂毛票，默认降权处理，它们是业绩策略里最容易亏钱的来源。

  ### 2. 辨识度的本质是共识

  涨得好是结果，不是原因。真正的内核是共识，而共识通常来自两类：

  - `逻辑共识`：市场第一时间能想到谁最受益。比如某种金属涨价，最容易被想到的行业龙头就是逻辑共识。
  - `资金共识`：某个票即使逻辑不最强，但被市场资金持续抱团、反复强化，最终走成核心，这就是资金共识。

  当做投机的、做业绩的、做成长的、做趋势的资金都开始撞票时，这个票的辨识度就最高。

  ### 3. 因子解释

  - `辨识度`
    - 第一优先级
    - 本质上是 `逻辑共识 + 资金共识`
    - 逻辑共识重点看：龙头、核心股、subtheme 纯度、白名单/反例样例、主营业务清晰度
    - 资金共识重点看：成交额、换手率、流动性、承接能力
  - `持续增长`
    - 看 `revenue_yoy / net_profit_yoy / roe`
    - 其中净利润同比的重要性高于营收同比
  - `大成交`
    - 单独保留为第二层确认因子
    - 用于压后“高辨识度但流动性不足”的票
  - `低估值`
    - 只做辅助加分，不得覆盖辨识度和增长的弱势
  - `股息率`
    - 只做末位辅助加分

  ## 七、统一评分框架

  请按下面 100 分框架给出判断，并说明每项依据：

  - 涨价事件强度：25 分
  - 产业链位置纯度：25 分
  - 利润传导能力：25 分
  - 财报/经营验证：15 分
  - 技术确认度：10 分

  结论分层：

  - 80-100：高概率业绩释放候选
  - 65-79：有逻辑但仍需验证
  - 50-64：主题映射存在，但兑现链条不完整
  - 50 以下：更像题材联动或伪受益

  ## 八、输出要求

  最终回答必须包含以下内容：

  1. `涨价事件`
     - 写清楚品类、催化来源和具体日期
  2. `产业链位置`
     - 说明公司在链条中是上游、中游、下游、分销还是库存受益方
     - 同时写清楚属于哪个 `subtheme`
  3. `利润传导判断`
     - 说明为什么能或不能转化为利润
  4. `业绩释放概率`
     - 给出高/中/低，并配合 100 分评分
  5. `关键证据`
     - 列出 3-5 条最重要证据
     - 若工具提供了 `matched_example` 或 `reference_examples`，可说明它更接近白名单还是反例
  6. `主要风险`
     - 包括涨价不可持续、映射偏弱、库存反噬、业绩未验证、追高风险
  7. `操作建议`
     - 明确是观察、等待回踩、右侧确认，还是仅作为题材跟踪

  ## 九、明确禁止

  - 禁止因为“板块涨了”就直接判定公司受益
  - 禁止把旧闻或无日期消息当成当前催化
  - 禁止把“题材映射”写成“业绩已经释放”
  - 对光纤、内存、硬盘这类链条不够纯的 A 股标的，证据不足时宁可保守