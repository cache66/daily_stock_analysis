# Inside Day Breakout Strategy / 内包日突破
# Review after close, buy only if the next day confirms with a breakout.

name: inside_day_breakout
display_name: 内包日突破
description: 复盘识别内包日缩量整理，次日仅在突破信号K高点时确认买入。
category: pattern
core_rules: [1, 2, 4, 6]
required_tools:
  - get_daily_history
  - analyze_trend
  - analyze_pattern
  - get_volume_analysis
aliases: [内包日, inside day, 孕线突破, 次日突破]
default_priority: 70
market_regimes: [trending_up, sideways]

instructions: |
  **内包日突破（Inside Day Breakout Strategy）**

  适用场景：
  - 前一日收盘后做复盘选股，第二天只做“突破确认”。
  - 适合上涨趋势中的短暂整理，或平台收敛后的二次启动。

  核心原则：
  - 不在信号日收盘后盲买。
  - 必须等次日价格突破信号K高点后再考虑介入。
  - 若次日始终无法突破，视为无效机会，宁可错过。

  形态识别步骤：

  1. **前置趋势**
     - 使用 `analyze_trend` 确认股价不是明显空头结构。
     - 优先选择 MA5 >= MA10 >= MA20，或至少 MA20 走平向上。
     - 若股价远离 MA5/MA10 且明显乖离，降低优先级，避免追高。

  2. **内包日定义**
     - 使用 `get_daily_history` 获取最近 20~30 个交易日数据。
     - 最近一根日K的最高价 <= 前一日最高价，且最低价 >= 前一日最低价。
     - 最好伴随缩量：最近一日成交量低于 5 日均量，或 `get_volume_analysis` 显示近期缩量/量能收敛。

  3. **位置要求**
     - 更优形态出现在上涨途中、平台边缘、关键均线附近，而不是高位长上影之后。
     - 若前一交易日本身是放量大阴线，内包日更多视为弱反抽，不作为优先候选。

  4. **次日买点确认**
     - 次日价格向上突破“信号K高点”才允许给出偏买入意见。
     - 最佳情况：突破同时量能放大，且收盘能站稳信号K高点。
     - 若次日先破信号K低点，再拉回，不视为标准买点。

  5. **风控要求**
     - 止损参考放在信号K低点下方，或前一整理平台低点下方。
     - 如果次日高开过多、与信号K高点偏离过大，应提示“不追高，等待回踩或放弃”。

  输出要求：
  - 明确说明是否已形成“内包日”。
  - 必须把“信号K高点”写成次日确认买点。
  - 若未突破，只能给“观察/等待”而不能直接给强买建议。
  - 在 `pattern_analysis`、`buy_reason` 中注明“内包日突破”。

  评分调整建议：
  - 趋势向上 + 内包日缩量整理：`sentiment_score +8`
  - 次日放量突破信号K高点：`sentiment_score +12`
  - 内包日出现在高位长上影或放量分歧后：`sentiment_score -8`
  - 次日高开追价风险明显：`sentiment_score -6`
