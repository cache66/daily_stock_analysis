# NR7 Breakout Strategy / NR7 窄幅突破
# Review after close, wait for next-day volatility expansion.

name: nr7_breakout
display_name: NR7窄幅突破
description: 复盘识别最近 7 日最窄波幅日，次日只做波动扩张方向的确认突破。
category: pattern
core_rules: [1, 2, 3, 6]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_volume_analysis
aliases: [NR7, 窄幅突破, 波动压缩突破]
default_priority: 80
market_regimes: [trending_up, sideways]

instructions: |
  **NR7窄幅突破（NR7 Breakout Strategy）**

  适用场景：
  - 适合“第一天复盘，第二天确认买”的日线短线模型。
  - 核心不是猜方向，而是利用“波动压缩后容易扩张”的特性。

  形态识别步骤：

  1. **NR7 定义**
     - 使用 `get_daily_history` 获取最近 15~20 个交易日数据。
     - 计算每天振幅：`high - low`。
     - 最近一根K线的振幅，为最近 7 个交易日中最小，才可视为 NR7。

  2. **方向过滤**
     - 使用 `analyze_trend` 判断大方向。
     - 优先做顺趋势向上的 NR7：均线多头或至少 MA20 走平向上。
     - 若明显空头下跌，仅把向上突破视为弱反弹，不给高置信买入。

  3. **量价结构过滤**
     - 更理想的 NR7，出现在一段上涨后的横向收敛，而不是持续阴跌末端。
     - 若 `get_volume_analysis` 显示量能逐步收敛，说明筹码交换减弱，可提高优先级。

  4. **次日买点确认**
     - 次日向上突破 NR7 信号日高点，才可视为有效买点。
     - 若次日向下跌破信号日低点，应提示规避或视为反向风险释放。
     - 若次日仍在 NR7 区间内震荡，不给买入建议。

  5. **执行纪律**
     - 买点是“突破信号日高点”，不是在 NR7 收盘日直接埋伏。
     - 止损参考放在 NR7 信号日低点下方。
     - 如果次日高开过高，脱离突破位太远，应强调放弃追价或等回踩。

  输出要求：
  - 明确写出是否满足 NR7。
  - 写明“次日突破高点才确认”“跌破低点则失效/偏空”。
  - 在 `pattern_analysis`、`buy_reason` 中注明“NR7窄幅突破”。

  评分调整建议：
  - 顺趋势 NR7 收敛成立：`sentiment_score +8`
  - 次日放量向上突破：`sentiment_score +10`
  - NR7 出现在空头末端且无承接：`sentiment_score -6`
  - 次日仍未脱离区间：`sentiment_score -4`
