# Reversal Confirmation Strategy / 次日反转确认
# Review reversal candles after close, buy only on next-day confirmation.

name: reversal_confirmation
display_name: 次日反转确认
description: 复盘识别吞没、刺透、早晨之星等反转K线，次日站上信号K高点后再确认买入。
category: reversal
core_rules: [1, 4, 5, 6]
required_tools:
  - get_daily_history
  - analyze_trend
  - analyze_pattern
  - search_stock_news
aliases: [次日确认, 反转确认, 吞没确认, 早晨之星确认]
default_priority: 90
market_regimes: [sideways, trending_down]

instructions: |
  **次日反转确认（Reversal Confirmation Strategy）**

  适用场景：
  - 用于“前一天看到反转K线，第二天等确认再买”的日线短线策略。
  - 适合回调到支撑位、均线附近、平台下沿附近后出现止跌信号的股票。

  核心原则：
  - 反转形态本身只是候选信号，不是直接买点。
  - 次日必须站上信号K高点，才视为买方接力成立。
  - 若只出现形态但没有确认，默认按观察处理。

  重点关注形态：
  - `analyze_pattern` 返回的看涨吞没（Bullish Engulfing）
  - 刺透形态 / 看涨孕线等双K止跌结构
  - 早晨之星（Morning Star）等三K反转结构
  - 带长下影的止跌阳线，但需要结合位置与次日确认

  形态识别步骤：

  1. **位置过滤**
     - 使用 `get_daily_history` + `analyze_trend` 判断是否处于“回调后的支撑区”。
     - 更优位置：MA10/MA20 附近、前低附近、平台下沿附近。
     - 若形态出现在连续大涨后的高位，优先视为震荡而非高胜率反转。

  2. **反转形态过滤**
     - 至少要有一类明确止跌信号：吞没、刺透、早晨之星、长下影阳线等。
     - 若信号K实体太弱、上影过长，说明分歧大，应下调权重。

  3. **次日确认买点**
     - 次日价格站上信号K高点，才允许给出偏买入意见。
     - 若次日仅高开后回落，收盘未站稳，则只能给“继续观察”。
     - 若次日跌破信号K低点，则视为反转失败。

  4. **风险排查**
     - 若可用，调用 `search_stock_news` 检查是否存在业绩暴雷、减持、监管等硬风险。
     - 基本面或消息面显著转坏时，即使形态成立也要降低置信度。

  5. **风控纪律**
     - 止损参考放在信号K低点或最近结构低点下方。
     - 这是短线反转模型，若 2~3 个交易日内无法延续，应主动降低预期。

  输出要求：
  - 明确指出是哪一种反转K线。
  - 必须把“次日站上信号K高点”写成确认条件。
  - 若没有确认，只能给观察，不直接建议买入。
  - 在 `pattern_analysis`、`buy_reason` 中注明“次日反转确认”。

  评分调整建议：
  - 支撑位附近出现明确反转K线：`sentiment_score +8`
  - 次日确认突破信号K高点：`sentiment_score +10`
  - 高位反转形态但位置不佳：`sentiment_score -6`
  - 次日跌破信号K低点：`sentiment_score -12`
